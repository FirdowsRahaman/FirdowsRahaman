<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="multiAgentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- Neural mesh connections -->
  <line x1="12" y1="4" x2="4.5" y2="10" stroke="url(#multiAgentGrad)" stroke-width="1.4" opacity="0.6"/>
  <line x1="12" y1="4" x2="19.5" y2="10" stroke="url(#multiAgentGrad)" stroke-width="1.4" opacity="0.6"/>
  <line x1="12" y1="4" x2="12" y2="12.5" stroke="url(#multiAgentGrad)" stroke-width="1.6"/>
  <line x1="4.5" y1="10" x2="7.5" y2="19" stroke="url(#multiAgentGrad)" stroke-width="1.4" opacity="0.6"/>
  <line x1="19.5" y1="10" x2="16.5" y2="19" stroke="url(#multiAgentGrad)" stroke-width="1.4" opacity="0.6"/>
  <line x1="7.5" y1="19" x2="16.5" y2="19" stroke="url(#multiAgentGrad)" stroke-width="1.4" opacity="0.6"/>
  <line x1="12" y1="12.5" x2="4.5" y2="10" stroke="url(#multiAgentGrad)" stroke-width="1.4"/>
  <line x1="12" y1="12.5" x2="19.5" y2="10" stroke="url(#multiAgentGrad)" stroke-width="1.4"/>
  <line x1="12" y1="12.5" x2="7.5" y2="19" stroke="url(#multiAgentGrad)" stroke-width="1.4"/>
  <line x1="12" y1="12.5" x2="16.5" y2="19" stroke="url(#multiAgentGrad)" stroke-width="1.4"/>
  <!-- Central orchestrator node -->
  <circle cx="12" cy="12.5" r="3.2" fill="url(#multiAgentGrad)"/>
  <circle cx="12" cy="12.5" r="1.4" fill="#FFFFFF"/>
  <!-- Outer agent nodes (Planner, Critic, Tool Executor, Visualizer) -->
  <circle cx="12" cy="4" r="2.2" fill="#8B5CF6"/>
  <circle cx="19.5" cy="10" r="2.2" fill="#6366F1"/>
  <circle cx="16.5" cy="19" r="2.2" fill="#0EA5E9"/>
  <circle cx="7.5" cy="19" r="2.2" fill="#06B6D4"/>
  <circle cx="4.5" cy="10" r="2.2" fill="#A855F7"/>
  <!-- Sparkle dots in outer nodes -->
  <circle cx="12" cy="4" r="0.8" fill="#FFFFFF"/>
  <circle cx="19.5" cy="10" r="0.8" fill="#FFFFFF"/>
  <circle cx="16.5" cy="19" r="0.8" fill="#FFFFFF"/>
  <circle cx="7.5" cy="19" r="0.8" fill="#FFFFFF"/>
  <circle cx="4.5" cy="10" r="0.8" fill="#FFFFFF"/>
</svg>